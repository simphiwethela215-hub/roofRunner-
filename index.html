<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Roof Runner: a free one-tap rooftop runner. Jump the gaps and crates, double jump, collect coins and unlock skins.">
<title>Roof Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one full-height portrait stage, canvas fills it, HUD on top, a card over it between runs. Night city, teal and amber. */
:root{
  --bg:#0a0f24;
  --ink:#eef6ff;
  --muted:#a9b8d4;
  --amber:#ffb84a;
  --teal:#38d4c4;
  --night:#16204a;
  --line:#2f3f7a;
  --font-display:'Bungee','Arial Black',Impact,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:none;background:var(--bg)}
body{
  box-sizing:border-box;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  padding-top:max(8px,env(safe-area-inset-top,0px));
  padding-bottom:max(8px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;
  justify-content:center;
  overflow:hidden;
}
[hidden]{display:none!important}
.stage{
  position:relative;
  width:100%;
  max-width:480px;
  height:100%;
  border-radius:18px;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  background:#0a1030;
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{
  position:absolute;top:12px;left:14px;right:14px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  pointer-events:none;
  font-family:var(--font-display);
  text-shadow:0 2px 0 rgba(10,15,36,.6);
}
.score{font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.small{font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px;text-shadow:none}
.coins{display:flex;align-items:center;gap:8px;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.dot{width:20px;height:20px;border-radius:50%;background:var(--amber);box-shadow:inset -3px -3px 0 #c98a2a}
.panel{
  position:absolute;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
  padding:16px;
  background:linear-gradient(to top,rgba(10,15,36,.92),rgba(10,15,36,.25) 75%);
}
.card{
  width:100%;
  background:var(--night);
  border:2px solid var(--line);
  border-radius:16px;
  padding:18px;
  display:flex;flex-direction:column;gap:12px;
  max-height:100%;
  overflow:auto;
}
h1{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted);line-height:1.45;max-width:65ch}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how li{background:rgba(238,246,255,.07);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.35;min-width:0}
.how b{display:block;color:var(--ink);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(238,246,255,.07);border-radius:10px;padding:9px 12px;min-width:0}
.stats span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats strong{font-family:var(--font-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.shop{display:flex;flex-direction:column;gap:8px}
.shop-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.shop-h b{color:var(--amber);font-family:var(--font-display);font-weight:400;font-size:16px;letter-spacing:0}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sk{
  --c:#ffffff;
  font-family:var(--font-body);font-weight:600;font-size:12px;line-height:1.2;
  padding:10px 4px;border-radius:10px;
  background:rgba(238,246,255,.07);color:var(--ink);
  border:2px solid var(--c);box-shadow:none;min-width:0;
}
.sk.on{background:var(--c);color:#10142e}
.sk:active{transform:none;box-shadow:none}
.skmsg{min-height:16px;font-size:12px;color:var(--amber)}
.note{font-size:12px;color:var(--muted)}
button{
  font-family:var(--font-display);font-size:20px;
  color:#2a1708;background:var(--amber);
  border:0;border-radius:12px;padding:14px 18px;cursor:pointer;
  box-shadow:0 4px 0 #b86f12;
}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #b86f12}
button:focus-visible,.ad:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ad{display:block;text-align:center;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0 2px}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Roof Runner game"></canvas>
  <div class="hud">
    <div>
      <div class="score" id="score">0</div>
      <div class="small">Best <span id="bestHud">0</span></div>
    </div>
    <div class="coins"><span id="coins">0</span><i class="dot"></i></div>
  </div>
  <div class="panel" id="panel">
    <div class="card">
      <h1 id="ttl">Roof Runner</h1>
      <p id="sub">Race across the rooftops at night. Jump the gaps and crates, and grab every coin.</p>
      <div class="stats" id="stats" hidden>
        <div><span>Score</span><strong id="fScore">0</strong></div>
        <div><span>Best</span><strong id="fBest">0</strong></div>
        <div><span>Coins</span><strong id="fCoins">0</strong></div>
      </div>
      <ul class="how" id="how">
        <li><b>Tap anywhere</b>Jump</li>
        <li><b>Tap again in the air</b>Double jump</li>
      </ul>
      <div class="shop">
        <div class="shop-h"><span>Skins</span><span>Your coins <b id="bank">0</b></span></div>
        <div class="skins" id="skins"></div>
        <div class="skmsg" id="skmsg"></div>
        <div class="note">Coins unlock skins in the game. They are not money.</div>
      </div>
      <button id="go" type="button">Run</button>
      <a class="ad" id="ad" href="https://asiafilm.org/4/be1f53fd20f5a7da692b949a214ebc87" target="_blank" rel="noopener noreferrer sponsored">Ad: see sponsored offers</a>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var cv = $('c'), ctx = cv.getContext('2d'), stage = $('stage');
  var W = 360, H = 640, sc = 1, HL = 640;

  function resize(){
    var r = cv.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width || 360; H = r.height || 640;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sc = W / 360; HL = H / sc;
  }
  window.addEventListener('resize', resize);
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  function GY(){ return HL * 0.7; }
  var PX = 96, GRAV = 1700, JV = 580, DV = 500;

  /* ---- saved progress: best score, coin bank, skins ---- */
  var SKINS = [
    { id:'teal',   name:'Teal',   cost:0,   shirt:'#38d4c4', scarf:'#ffb84a' },
    { id:'ember',  name:'Ember',  cost:30,  shirt:'#ff6b4a', scarf:'#ffe08a' },
    { id:'violet', name:'Violet', cost:60,  shirt:'#a78bfa', scarf:'#7ef0d4' },
    { id:'gold',   name:'Gold',   cost:120, shirt:'#ffcf4a', scarf:'#ff6b9a' }
  ];
  var best = 0, bank = 0, owned = ['teal'], skin = 'teal';
  try {
    best = +localStorage.getItem('roof-runner-best') || 0;
    bank = +localStorage.getItem('roof-runner-bank') || 0;
    var ow = JSON.parse(localStorage.getItem('roof-runner-owned') || 'null');
    if (ow && ow.length) owned = ow;
    skin = localStorage.getItem('roof-runner-skin') || 'teal';
  } catch (e) {}
  if (owned.indexOf(skin) < 0) skin = 'teal';
  function save(){
    try {
      localStorage.setItem('roof-runner-best', String(best));
      localStorage.setItem('roof-runner-bank', String(bank));
      localStorage.setItem('roof-runner-owned', JSON.stringify(owned));
      localStorage.setItem('roof-runner-skin', skin);
    } catch (e) {}
  }
  function skinObj(){
    for (var i = 0; i < SKINS.length; i++) if (SKINS[i].id === skin) return SKINS[i];
    return SKINS[0];
  }
  function renderSkins(){
    $('bank').textContent = bank;
    var box = $('skins');
    box.innerHTML = '';
    SKINS.forEach(function(k){
      var has = owned.indexOf(k.id) >= 0;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sk' + (k.id === skin ? ' on' : '');
      b.textContent = has ? k.name : (k.cost + ' coins');
      if (b.style && b.style.setProperty) b.style.setProperty('--c', k.shirt);
      b.addEventListener('click', function(){
        if (has){ skin = k.id; }
        else if (bank >= k.cost){ bank -= k.cost; owned.push(k.id); skin = k.id; }
        else { $('skmsg').textContent = 'Need ' + (k.cost - bank) + ' more coins'; return; }
        $('skmsg').textContent = '';
        save(); renderSkins();
      });
      box.appendChild(b);
    });
  }
  $('bestHud').textContent = best;
  renderSkins();

  function rnd(a, b){ return a + Math.random() * (b - a); }

  function fresh(){
    return { mode:'ready', t:0, dist:0, speed:230, h:0, vy:0, grounded:true, jumps:0,
             coyote:.09, buf:0, plats:[], obs:[], coins:[], head:0, n:0, got:0, deadT:0,
             parts:[], pops:[], shake:0, dust:0, land:0 };
  }
  var S = fresh();
  function initWorld(){
    S.plats = [{ x:-300, w:900, id:0, dec:[{ t:'tank', x:180 }, { t:'ant', x:420 }] }];
    S.obs = []; S.coins = [];
    S.head = 720;
  }
  initWorld();

  function score(){ return Math.floor(S.dist / 10) + S.got * 10; }

  function generate(){
    while (S.head < 360 + 900){
      var m = S.speed * 0.62 + 60;
      var r = Math.random();
      var nOb = S.n < 2 ? 0 : (r < 0.35 ? 0 : (r < 0.8 ? 1 : 2));
      var list = [], len = 0, i;
      for (i = 0; i < nOb; i++){
        var crate = Math.random() < 0.6;
        var o = { type: crate ? 'crate' : 'vent', w: crate ? 34 : 26, h: crate ? 36 : 56 };
        list.push(o); len += o.w;
      }
      var spacing = S.speed * 0.55 + 60;
      var inner = nOb ? len + (nOb - 1) * spacing : 0;
      var pw = nOb ? m + inner + m + rnd(0, 60) : rnd(180, 380);
      var x0 = S.head;
      var dec = [], nd = Math.floor(pw / 220), kinds = ['tank', 'ant', 'ac'];
      for (i = 0; i < nd; i++) dec.push({ t: kinds[Math.floor(Math.random() * 3)], x: rnd(30, pw - 30) });
      S.plats.push({ x:x0, w:pw, id:S.n + 1, dec:dec });
      var cx = x0 + m, k;
      for (i = 0; i < list.length; i++){
        var ob = { type:list[i].type, x:cx, w:list[i].w, h:list[i].h };
        S.obs.push(ob);
        if (i === 0){
          var arc = [0, 14, 22, 14, 0];
          for (k = 0; k < 5; k++) S.coins.push({ x: ob.x + ob.w / 2 + (k - 2) * 30, h: 62 + arc[k], got:false });
        }
        cx += list[i].w + spacing;
      }
      if (nOb === 0 && Math.random() < 0.6){
        for (k = 0; k < 5; k++) S.coins.push({ x: x0 + pw * 0.3 + k * 26, h: 34, got:false });
      }
      var gw = (70 + S.speed * 0.2) * rnd(0.85, 1.15);
      if (Math.random() < 0.5){
        for (k = 0; k < 5; k++) S.coins.push({ x: x0 + pw + gw * (k + 0.5) / 5, h: 30 + 60 * Math.sin(Math.PI * (k + 0.5) / 5), got:false });
      }
      S.head = x0 + pw + gw;
      S.n++;
    }
  }

  function emit(x, y, vx, vy, life, r, col, g){
    if (S.parts.length > 140) return;
    S.parts.push({ x:x, y:y, vx:vx, vy:vy, l:life, m:life, r:r, c:col, g:g || 0 });
  }
  function burst(x, y, n, col, spd, life, g){
    for (var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2, v = rnd(spd * 0.4, spd);
      emit(x, y, Math.cos(a) * v, Math.sin(a) * v, rnd(life * 0.6, life), rnd(1.5, 3.2), col, g);
    }
  }

  function doJump(){
    S.vy = JV; S.grounded = false; S.jumps = 1; S.coyote = 0; S.buf = 0;
    var gy = GY();
    for (var i = 0; i < 5; i++) emit(PX + rnd(-6, 6), gy - 2, rnd(-90, -20), rnd(-30, -5), 0.35, rnd(2, 4), 'rgba(210,200,180,.55)', 0);
  }
  function tap(){
    if (S.mode !== 'run') return;
    if (S.grounded || S.coyote > 0) doJump();
    else if (S.jumps < 2){
      S.vy = DV; S.jumps = 2; S.buf = 0;
      burst(PX, GY() - S.h, 8, 'rgba(120,240,230,.8)', 90, 0.4, 0);
    }
    else S.buf = 0.12;
  }

  function crash(){
    S.mode = 'over';
    S.shake = 14;
    var gy = GY();
    burst(PX, gy - S.h - 20, 26, '#ff8a5c', 220, 0.8, 500);
    burst(PX, gy - S.h - 20, 12, skinObj().shirt, 180, 0.7, 500);
    var sc0 = score();
    var isBest = sc0 > best;
    if (isBest) best = sc0;
    bank += S.got;
    save();
    setTimeout(function(){ showOver(sc0, isBest); }, 650);
  }

  function showOver(sc0, isBest){
    $('ttl').textContent = isBest ? 'New best!' : 'Game over';
    $('sub').textContent = isBest ? 'That is your furthest run yet. Beat it again?' : 'You fell or hit something. Go again and get further.';
    $('fScore').textContent = sc0;
    $('fBest').textContent = best;
    $('fCoins').textContent = S.got;
    $('bestHud').textContent = best;
    $('stats').hidden = false;
    $('how').hidden = true;
    $('go').textContent = 'Run again';
    $('skmsg').textContent = '';
    renderSkins();
    $('panel').hidden = false;
    try { $('go').focus(); } catch (e) {}
  }

  var lastScore = -1, lastCoins = -1;
  function start(){
    S = fresh();
    initWorld();
    S.mode = 'run';
    lastScore = -1; lastCoins = -1;
    $('panel').hidden = true;
  }

  function update(dt){
    S.t += dt;
    var i;
    for (i = S.parts.length - 1; i >= 0; i--){
      var q = S.parts[i];
      q.l -= dt;
      if (q.l <= 0){ S.parts.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt;
    }
    for (i = S.pops.length - 1; i >= 0; i--){
      S.pops[i].l -= dt; S.pops[i].y -= 38 * dt;
      if (S.pops[i].l <= 0) S.pops.splice(i, 1);
    }
    if (S.shake > 0) S.shake = Math.max(0, S.shake - 40 * dt);
    if (S.land > 0) S.land -= dt;
    if (S.mode === 'over'){ S.deadT += dt; return; }
    if (S.mode !== 'run') return;
    S.speed = Math.min(430, 230 + S.dist * 0.02);
    var dx = S.speed * dt;
    S.dist += dx;
    for (i = 0; i < S.plats.length; i++) S.plats[i].x -= dx;
    for (i = 0; i < S.obs.length; i++) S.obs[i].x -= dx;
    for (i = 0; i < S.coins.length; i++) S.coins[i].x -= dx;
    S.head -= dx;
    generate();

    if (S.buf > 0) S.buf -= dt;
    S.vy -= GRAV * dt;
    S.h += S.vy * dt;
    var over = false;
    for (i = 0; i < S.plats.length; i++){
      var p = S.plats[i];
      if (PX + 8 > p.x && PX - 8 < p.x + p.w){ over = true; break; }
    }
    var gy = GY();
    if (S.h <= 0 && S.vy <= 0 && over && S.h > -28){
      S.h = 0; S.vy = 0;
      if (!S.grounded){
        S.grounded = true; S.jumps = 0; S.land = 0.14;
        for (i = 0; i < 6; i++) emit(PX + rnd(-8, 8), gy - 2, rnd(-120, 40), rnd(-40, -5), 0.35, rnd(2, 4), 'rgba(210,200,180,.55)', 0);
        if (S.buf > 0){ S.buf = 0; doJump(); }
      }
      if (S.grounded){
        S.coyote = 0.09;
        S.dust -= dt;
        if (S.dust <= 0){
          S.dust = 0.07;
          emit(PX - 8, gy - 2, -S.speed * 0.45 - rnd(0, 40), rnd(-40, -8), 0.34, rnd(2, 3.6), 'rgba(210,200,180,.5)', 0);
        }
      }
    } else {
      S.grounded = false;
      S.coyote -= dt;
      if (over && S.h <= -28){ crash(); return; }
      if (S.h < -80){ crash(); return; }
    }

    var py = gy - S.h;
    var pl = PX - 10, pr = PX + 10, pt = py - 42, pb = py;
    for (i = 0; i < S.obs.length; i++){
      var o = S.obs[i];
      if (pr > o.x + 3 && pl < o.x + o.w - 3 && pb > gy - o.h + 3){ crash(); return; }
    }
    for (i = 0; i < S.coins.length; i++){
      var c = S.coins[i];
      if (c.got) continue;
      var cy = gy - c.h;
      if (Math.abs(c.x - PX) < 20 && cy > pt - 6 && cy < pb + 10){
        c.got = true; S.got++;
        burst(c.x, cy, 7, '#ffd75e', 120, 0.45, 0);
        S.pops.push({ x:c.x, y:cy - 10, l:0.7, m:0.7, txt:'+1' });
      }
    }
    S.plats = S.plats.filter(function(q){ return q.x + q.w > -120; });
    S.obs = S.obs.filter(function(q){ return q.x + q.w > -60; });
    S.coins = S.coins.filter(function(q){ return q.x > -40 && !q.got; });
  }

  /* ---- drawing ---- */
  function rr(x, y, w, h, r){
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }
  function line(x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  function hash(n){ return ((n * 2654435761) >>> 0) % 1000 / 1000; }

  function skyline(off, bw, baseH, col, win, ant){
    var gy = GY(), i0 = Math.floor(off / bw), i, x, h, wx, wy;
    for (i = i0; i * bw - off < 360 + bw; i++){
      h = baseH + hash(i + 7) * baseH * 0.9;
      x = i * bw - off;
      ctx.fillStyle = col;
      ctx.fillRect(x, gy - h, bw + 1, h + (HL - gy));
      if (ant && hash(i + 40) > 0.62){
        ctx.strokeStyle = col; ctx.lineWidth = 2;
        line(x + bw / 2, gy - h, x + bw / 2, gy - h - 18);
        if (Math.sin(S.t * 3 + i * 1.7) > 0){
          ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(x + bw / 2, gy - h - 19, 2, 0, 7); ctx.fill();
        }
      }
      if (win){
        for (wy = gy - h + 10; wy < gy - 14; wy += 18){
          for (wx = x + 8; wx < x + bw - 8; wx += 14){
            var hv = hash(i * 31 + Math.floor(wy) * 7 + Math.floor((wx - x) / 14));
            if (hv < 0.28 && !(hv < 0.05 && Math.sin(S.t * 2.2 + i + wy) > 0.5)){
              ctx.fillStyle = hv < 0.1 ? '#8fe8ff' : '#ffcf6b';
              ctx.fillRect(wx, wy, 5, 7);
            }
          }
        }
      }
    }
  }

  function deco(p, gy){
    var i, d, x;
    ctx.fillStyle = '#1d286a'; ctx.strokeStyle = '#1d286a'; ctx.lineWidth = 2;
    for (i = 0; i < p.dec.length; i++){
      d = p.dec[i]; x = p.x + d.x;
      if (x < -40 || x > 400) continue;
      if (d.t === 'tank'){
        line(x - 8, gy, x - 8, gy - 14); line(x + 8, gy, x + 8, gy - 14);
        ctx.fillRect(x - 12, gy - 36, 24, 22);
        ctx.beginPath(); ctx.moveTo(x - 14, gy - 36); ctx.lineTo(x, gy - 46); ctx.lineTo(x + 14, gy - 36); ctx.closePath(); ctx.fill();
      } else if (d.t === 'ant'){
        line(x, gy, x, gy - 52); line(x - 8, gy - 36, x + 8, gy - 36); line(x - 5, gy - 44, x + 5, gy - 44);
        if (Math.sin(S.t * 3 + x * 0.1) > 0){
          ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(x, gy - 53, 2.2, 0, 7); ctx.fill(); ctx.fillStyle = '#1d286a';
        }
      } else {
        ctx.fillRect(x - 15, gy - 15, 30, 15);
        ctx.fillStyle = '#0b1030'; ctx.beginPath(); ctx.arc(x, gy - 8, 5, 0, 7); ctx.fill(); ctx.fillStyle = '#1d286a';
      }
    }
  }

  function drawPlayer(){
    var gy = GY(), py = gy - S.h, x = PX, sk = skinObj();
    var ph = S.mode === 'run' ? S.dist * 0.09 : S.t * 9;
    var air = S.h > 0.5 || !S.grounded;
    var sx = 1, sy = 1;
    if (S.land > 0){ sx = 1.14; sy = 0.86; }
    else if (air && S.vy > 120){ sx = 0.92; sy = 1.1; }
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(x, gy + 1, 13 * Math.max(0.3, 1 - S.h / 140), 3, 0, 0, 7); ctx.fill();
    ctx.save();
    ctx.translate(x, py); ctx.scale(sx, sy); ctx.translate(-x, -py);
    var hip = py - 17, sw = air ? 5 : Math.sin(ph) * 9;
    var bob = air ? 0 : Math.abs(Math.sin(ph)) * 1.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1b2252'; ctx.lineWidth = 5;
    line(x - 3, hip - bob, x - 3 + sw, py - (air ? 5 : Math.max(0, Math.cos(ph)) * 4));
    line(x + 3, hip - bob, x + 3 - sw, py - (air ? 9 : Math.max(0, -Math.cos(ph)) * 4));
    ctx.fillStyle = '#f3f6ff';
    ctx.beginPath(); ctx.ellipse(x - 3 + sw, py - (air ? 5 : Math.max(0, Math.cos(ph)) * 4), 4, 2.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 3 - sw, py - (air ? 9 : Math.max(0, -Math.cos(ph)) * 4), 4, 2.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = sk.shirt; rr(x - 9, hip - 21 - bob, 18, 23, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(x - 7, hip - 19 - bob, 5, 17, 3); ctx.fill();
    ctx.strokeStyle = '#e0a67a'; ctx.lineWidth = 4;
    var as = air ? -6 : Math.sin(ph) * 7;
    line(x + 6, hip - 15 - bob, x + 12 + as * 0.4, hip - 5 + as * 0.4 - bob);
    line(x - 6, hip - 15 - bob, x - 10 - as * 0.4, hip - 5 - as * 0.4 - bob);
    ctx.fillStyle = '#e0a67a'; ctx.beginPath(); ctx.arc(x + 1, hip - 30 - bob, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#2b1b17'; ctx.beginPath(); ctx.arc(x, hip - 31 - bob, 8.5, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#2b1b17'; ctx.beginPath(); ctx.arc(x - 8, hip - 28 - bob, 3, 0, 7); ctx.fill();
    var blink = (S.t % 3.2) < 0.12;
    if (!blink){ ctx.fillStyle = '#10142e'; ctx.beginPath(); ctx.arc(x + 5, hip - 30 - bob, 1.7, 0, 7); ctx.fill(); }
    var wv = Math.sin(S.t * 14) * 3, wv2 = Math.sin(S.t * 14 + 1.4) * 3;
    ctx.fillStyle = sk.scarf;
    ctx.beginPath(); ctx.moveTo(x - 7, hip - 19 - bob);
    ctx.quadraticCurveTo(x - 18, hip - 21 + wv - bob, x - 30, hip - 14 + wv2 - bob);
    ctx.lineTo(x - 25, hip - 8 + wv2 - bob);
    ctx.quadraticCurveTo(x - 15, hip - 14 + wv - bob, x - 5, hip - 13 - bob); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.scale(sc, sc);
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    var gy = GY(), i, k;

    var g = ctx.createLinearGradient(0, 0, 0, gy);
    g.addColorStop(0, '#080d29'); g.addColorStop(0.55, '#26307a'); g.addColorStop(1, '#f0805c');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, 400, HL + 40);

    for (i = 0; i < 34; i++){
      ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.6 * (0.5 + 0.5 * Math.sin(S.t * 2 + i * 1.9))).toFixed(2) + ')';
      ctx.fillRect(hash(i + 3) * 360, hash(i + 90) * gy * 0.55, 1.6, 1.6);
    }
    var mg = ctx.createRadialGradient(270, gy * 0.26, 10, 270, gy * 0.26, 70);
    mg.addColorStop(0, 'rgba(255,241,201,.55)'); mg.addColorStop(1, 'rgba(255,241,201,0)');
    ctx.fillStyle = mg; ctx.fillRect(190, gy * 0.26 - 80, 160, 160);
    ctx.fillStyle = '#fff1c9'; ctx.beginPath(); ctx.arc(270, gy * 0.26, 24, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(200,170,120,.35)';
    ctx.beginPath(); ctx.arc(263, gy * 0.26 - 4, 6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(277, gy * 0.26 + 7, 4, 0, 7); ctx.fill();

    for (i = 0; i < 3; i++){
      var cxp = 440 - ((S.t * (5 + i * 2) + i * 190) % 560), cyp = gy * (0.2 + 0.15 * i);
      ctx.fillStyle = 'rgba(150,110,190,.2)';
      ctx.beginPath(); ctx.ellipse(cxp, cyp, 42, 9, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cxp + 22, cyp - 6, 26, 8, 0, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = '#0c1233'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    for (i = 0; i < 4; i++){
      var bx = 430 - ((S.t * (22 + i * 7) + i * 140) % 520);
      var by = gy * (0.14 + i * 0.07) + Math.sin(S.t * 2 + i) * 6;
      var fl = Math.sin(S.t * 9 + i * 2) * 4;
      ctx.beginPath(); ctx.moveTo(bx - 8, by + fl * 0.8);
      ctx.quadraticCurveTo(bx - 3, by - 4 + fl, bx, by);
      ctx.quadraticCurveTo(bx + 3, by - 4 + fl, bx + 8, by + fl * 0.8); ctx.stroke();
    }

    skyline(S.dist * 0.1, 46, 60, '#1a2150', false, true);
    skyline(S.dist * 0.26, 58, 82, '#121a40', true, false);

    if (S.speed > 280 && S.mode === 'run'){
      ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1.5;
      for (i = 0; i < 8; i++){
        var lx = 380 - ((S.t * 950 + i * 97) % 440), ly = 40 + hash(i + 50) * (gy - 90);
        line(lx, ly, lx + 24 + S.speed * 0.05, ly);
      }
    }

    for (i = 0; i < S.plats.length; i++){
      var p = S.plats[i];
      if (p.x > 370 || p.x + p.w < -10) continue;
      deco(p, gy);
      ctx.fillStyle = '#0b1030'; ctx.fillRect(p.x, gy, p.w, HL - gy + 2);
      ctx.fillStyle = '#34449c'; ctx.fillRect(p.x, gy, p.w, 7);
      ctx.fillStyle = 'rgba(120,230,255,.55)'; ctx.fillRect(p.x, gy, p.w, 1.5);
      var k0 = Math.max(0, Math.floor((-20 - p.x) / 22));
      for (k = k0; k * 22 + 12 < p.w - 6 && p.x + k * 22 < 380; k++){
        for (var wy = gy + 28; wy < HL; wy += 26){
          var hv = hash(p.id * 131 + k * 17 + Math.floor(wy));
          if (hv < 0.3 && !(hv < 0.04 && Math.sin(S.t * 2 + k + wy) > 0.4)){
            ctx.fillStyle = hv < 0.08 ? '#8fe8ff' : '#ffcf6b';
            ctx.fillRect(p.x + 12 + k * 22, wy, 8, 11);
          }
        }
      }
    }

    for (i = 0; i < S.obs.length; i++){
      var o = S.obs[i];
      if (o.x > 370 || o.x + o.w < -10) continue;
      var ty = gy - o.h;
      if (o.type === 'crate'){
        ctx.fillStyle = '#b06a32'; ctx.fillRect(o.x, ty, o.w, o.h);
        ctx.fillStyle = '#c98048'; ctx.fillRect(o.x, ty, o.w, 4);
        ctx.strokeStyle = '#5a3216'; ctx.lineWidth = 3; ctx.strokeRect(o.x + 1.5, ty + 1.5, o.w - 3, o.h - 3);
        ctx.lineWidth = 2; line(o.x + 3, ty + 3, o.x + o.w - 3, gy - 3); line(o.x + o.w - 3, ty + 3, o.x + 3, gy - 3);
      } else {
        ctx.fillStyle = '#6c7a99'; ctx.fillRect(o.x, ty, o.w, o.h);
        ctx.fillStyle = '#9aa8c6'; ctx.fillRect(o.x - 3, ty, o.w + 6, 8);
        ctx.strokeStyle = '#46526e'; ctx.lineWidth = 2;
        for (k = 1; k < 5; k++) line(o.x + 3, ty + 8 + k * 9, o.x + o.w - 3, ty + 8 + k * 9);
        ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(o.x + 2, ty + 8, 3, o.h - 8);
      }
    }

    for (i = 0; i < S.coins.length; i++){
      var c = S.coins[i];
      if (c.x > 380 || c.x < -20 || c.got) continue;
      var cw = Math.max(2, 9 * Math.abs(Math.cos(S.t * 6 + c.x * 0.05)));
      var cyy = gy - c.h + Math.sin(S.t * 4 + c.x * 0.08) * 2;
      var cg = ctx.createRadialGradient(c.x, cyy, 2, c.x, cyy, 17);
      cg.addColorStop(0, 'rgba(255,215,94,.45)'); cg.addColorStop(1, 'rgba(255,215,94,0)');
      ctx.fillStyle = cg; ctx.fillRect(c.x - 18, cyy - 18, 36, 36);
      ctx.fillStyle = '#ffc94d'; ctx.strokeStyle = '#b8862a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(c.x, cyy, cw, 9, 0, 0, 7); ctx.fill(); ctx.stroke();
    }

    drawPlayer();

    for (i = 0; i < S.parts.length; i++){
      var q = S.parts[i];
      ctx.globalAlpha = Math.max(0, q.l / q.m);
      ctx.fillStyle = q.c;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = '700 13px DM Sans, system-ui, sans-serif';
    ctx.textAlign = 'center';
    for (i = 0; i < S.pops.length; i++){
      var pp = S.pops[i];
      ctx.globalAlpha = Math.max(0, pp.l / pp.m);
      ctx.fillStyle = '#ffd75e';
      ctx.fillText(pp.txt, pp.x, pp.y);
    }
    ctx.globalAlpha = 1;

    if (S.mode === 'run' && S.dist < 700){
      ctx.fillStyle = 'rgba(238,246,255,.92)';
      ctx.font = '22px Bungee, Impact, sans-serif';
      ctx.fillText('TAP TO JUMP', 180, gy * 0.5);
    }
    ctx.textAlign = 'left';

    var vg = ctx.createRadialGradient(180, HL * 0.5, HL * 0.3, 180, HL * 0.5, HL * 0.85);
    vg.addColorStop(0, 'rgba(5,8,20,0)'); vg.addColorStop(1, 'rgba(5,8,20,.5)');
    ctx.fillStyle = vg; ctx.fillRect(-20, -20, 400, HL + 40);
    if (S.mode === 'over'){
      ctx.fillStyle = 'rgba(239,90,70,.18)'; ctx.fillRect(-20, -20, 400, HL + 40);
    }
    ctx.restore();
  }

  function hud(){
    var s0 = score();
    if (s0 !== lastScore){ $('score').textContent = s0; lastScore = s0; }
    if (S.got !== lastCoins){ $('coins').textContent = S.got; lastCoins = S.got; }
  }

  var last = 0;
  function frame(ts){
    var dt = Math.min(0.04, (ts - last) / 1000 || 0);
    last = ts;
    update(dt); draw(); hud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  stage.addEventListener('pointerdown', function(e){
    if (S.mode === 'run'){ e.preventDefault(); tap(); }
  });
  window.addEventListener('keydown', function(e){
    var k = e.key;
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W'){
      e.preventDefault();
      if (S.mode === 'run') tap();
      else if (!$('panel').hidden) start();
    } else if (k === 'Enter' && S.mode !== 'run' && !$('panel').hidden){
      e.preventDefault(); start();
    }
  });
  $('go').addEventListener('click', start);

  return { getS:function(){ return S; }, update:update, tap:tap, start:start, draw:draw };
})();
</script>
</body>
</html>
