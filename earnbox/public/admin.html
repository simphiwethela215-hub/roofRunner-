<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a16"><title>EarnBox Admin</title><link rel="stylesheet" href="/styles.css"><script src="/admin.js" defer></script></head>
<body><header class="topbar"><a class="brand" href="/">Earn<span>Box</span></a><span class="muted">Admin dashboard</span><button id="admin-logout" class="button secondary small-button" hidden>Log out</button></header><main class="wrap admin-wrap"><section id="admin-login" class="card auth-card"><p class="eyebrow">ADMIN ACCESS</p><h1>Sign in</h1><form id="admin-login-form"><label>Admin password<input name="password" type="password" autocomplete="current-password" required></label><button class="button">Log in</button></form><p id="admin-error" class="error" role="alert"></p></section>
<section id="admin-view" hidden><div class="welcome"><div><p class="eyebrow">OVERVIEW</p><h1>Manage EarnBox</h1></div></div><div id="overview" class="stat-grid"></div><div class="content-grid admin-grid"><section class="card section"><h2>Withdrawals</h2><div id="withdrawals" class="table-wrap"></div></section><section class="card section"><h2>Users</h2><form id="credit-form" class="inline-form"><input name="userId" type="number" placeholder="User ID" required><input name="points" type="number" placeholder="Points (+/-)" required><input name="note" maxlength="100" placeholder="Reason"><button class="button small-button">Adjust</button></form><div id="users" class="table-wrap"></div></section><section class="card section"><h2>Tasks and offers</h2><form id="task-form"><label>Title<input name="title" maxlength="60" required></label><label>Description<input name="description" maxlength="140"></label><label>Points<input name="points" type="number" min="1" required></label><label>HTTPS task URL <span class="hint">optional; {userId} supported</span><input name="url" type="url" placeholder="https://…"></label><button class="button">Add task</button></form><div id="tasks" class="task-list"></div></section></div></section></main><footer>Keep admin access private. Admin actions are logged in account transaction history.</footer></body></html>
